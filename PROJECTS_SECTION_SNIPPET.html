  ════════════════════════════════════════════════════════════════
  STEP 1 — Add these two lines inside your existing <head> tag:
  ════════════════════════════════════════════════════════════════

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/projects.css">

  ════════════════════════════════════════════════════════════════
  STEP 2 — Paste this <section> block where you want projects
           to appear in your existing <body> content.
  ════════════════════════════════════════════════════════════════
-->

<section id="projects" aria-labelledby="projects-heading">
  <div class="projects-container">

    <!-- Section Header -->
    <header class="projects-header">
      <div class="projects-title-row">
        <h2 class="projects-title" id="projects-heading">projects</h2>
        <span id="projects-count" aria-live="polite" aria-atomic="true"></span>
      </div>
      <p class="projects-subtitle">
        Automatically pulled from GitHub · tagged
        <code style="font-size:0.8em;opacity:0.8">portfolio</code> topic
      </p>
    </header>

    <!-- Error Banner (hidden until needed) -->
    <div id="projects-error" role="alert" hidden></div>

    <!-- Controls: search + language filters -->
    <div class="projects-controls">
      <div class="projects-search-wrap">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
          <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0
          1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749
          0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499
          4.499 0 0 0 11.5 7Z"/>
        </svg>
        <input
          type="search"
          id="projects-search"
          placeholder="Search projects..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Search repositories"
        >
      </div>

      <!-- Filter buttons are injected here by projects.js -->
      <div id="projects-filter-bar" role="group" aria-label="Filter by language"></div>
    </div>

    <!-- Project Cards Grid (skeletons → real cards) -->
    <div
      id="projects-grid"
      role="list"
      aria-label="GitHub repositories"
      aria-live="polite"
      aria-busy="true"
    ></div>

    <!-- Link to full GitHub profile -->
    <footer class="projects-footer">
      <a
        href="https://github.com/ahsanurrahman-sayem"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View all repositories on GitHub"
      >
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0
          1-5.45 7.59c-.4.08-.55-.17-.55-.38
          0-.27.01-1.13.01-2.2
          0-.75-.25-1.23-.54-1.48
          1.78-.2 3.65-.88 3.65-3.95
          0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12
          0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68
          0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44
          1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15
          0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51
          1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82
          1.13.16.45.68 1.31 2.69.94
          0 .67.01 1.3.01 1.49
          0 .21-.15.45-.55.38A7.995
          7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>
        </svg>
        View all repositories on GitHub
      </a>
    </footer>

  </div>
</section>
